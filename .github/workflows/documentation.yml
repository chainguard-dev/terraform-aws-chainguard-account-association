name: Generate terraform docs

on:
  pull_request:

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Render terraform docs and fail on diff
      uses: step-security/terraform-docs-action@009ca67cbaa19496e50a6691ce86a26d49cb0b57 # v1.4.6
      with:
        working-dir: .
        output-file: README.md
        output-method: inject
        fail-on-diff: "true"
    - name: Dump README
      if: failure()
      run: |
        cat README.md
